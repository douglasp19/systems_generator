# =========================================================================
# SCHEMA DO SISTEMA
# Este arquivo define TODO o sistema: tabelas, campos, tipos e telas.
# Para criar um sistema novo pra um cliente, basta copiar este arquivo,
# renomear e ajustar as tabelas/campos abaixo. Não precisa mexer em código.
# =========================================================================

sistema:
  nome: "Controle de Estoque - Exemplo"
  banco: "data/sistema.db"

  # --- Impressora térmica (opcional) ------------------------------------
  # conexao: usb | rede | serial | arquivo (arquivo = modo teste, sem hardware)
  impressora:
    ativo: true
    conexao: arquivo        # troque para "usb" ou "rede" numa impressora real
    vendor_id: "0x04b8"     # só usado quando conexao: usb
    product_id: "0x0202"    # só usado quando conexao: usb
    ip: "192.168.0.50"      # só usado quando conexao: rede
    porta: 9100
    colunas: 42              # 32 para bobina 58mm, 42-48 para 80mm

  # --- Nota fiscal via gateway (opcional) --------------------------------
  # A gestão do sistema é local, mas emitir nota fiscal EXIGE internet e
  # certificado digital (a SEFAZ autoriza a nota em tempo real) -- por
  # isso essa parte específica fala com um gateway fiscal terceirizado.
  # O token da API NUNCA vai aqui -- fica numa variável de ambiente,
  # cujo NOME é informado em api_token_env.
  fiscal:
    ativo: true
    provedor: "focus_nfe"           # focus_nfe | plugnotas | enotas | nuvem_fiscal ...
    ambiente: "homologacao"         # troque para "producao" quando for para valer
    api_url: "https://homologacao.focusnfe.com.br/v2"
    api_token_env: "FOCUS_NFE_TOKEN"
    cnpj_emitente: "00.000.000/0001-00"

tabelas:

  - nome: produtos
    label: "Produtos"
    icone: "inventory_2"
    campos:
      - nome: nome
        label: "Nome do produto"
        tipo: texto
        obrigatorio: true
        buscavel: true

      - nome: categoria
        label: "Categoria"
        tipo: texto
        obrigatorio: false
        buscavel: true

      - nome: quantidade
        label: "Quantidade em estoque"
        tipo: inteiro
        obrigatorio: true
        default: 0
        minimo: 0     # não faz sentido estoque negativo

      - nome: preco_custo
        label: "Preço de custo (R$)"
        tipo: decimal
        obrigatorio: false
        default: 0.0
        minimo: 0

      - nome: preco_venda
        label: "Preço de venda (R$)"
        tipo: decimal
        obrigatorio: true
        default: 0.0
        minimo: 0

      - nome: estoque_minimo
        label: "Estoque mínimo"
        tipo: inteiro
        obrigatorio: false
        default: 5
        minimo: 0

      - nome: ativo
        label: "Ativo"
        tipo: booleano
        obrigatorio: false
        default: true

      - nome: observacoes
        label: "Observações"
        tipo: texto_longo
        obrigatorio: false

    # Layout em abas no formulário -- opcional. Se não for definido,
    # todos os campos aparecem numa coluna só (comportamento antigo).
    abas:
      - nome: "Dados gerais"
        campos: [nome, categoria, ativo]
      - nome: "Preços e estoque"
        campos: [quantidade, preco_custo, preco_venda, estoque_minimo]
      - nome: "Outros"
        campos: [observacoes]

  - nome: fornecedores
    label: "Fornecedores"
    icone: "local_shipping"
    campos:
      - nome: nome
        label: "Nome/Razão social"
        tipo: texto
        obrigatorio: true
        buscavel: true

      - nome: telefone
        label: "Telefone"
        tipo: texto
        obrigatorio: false

      - nome: email
        label: "E-mail"
        tipo: texto
        obrigatorio: false

      - nome: data_cadastro
        label: "Data de cadastro"
        tipo: data
        obrigatorio: false

  - nome: clientes
    label: "Clientes"
    icone: "person"
    campos:
      - nome: nome
        label: "Nome / Razão social"
        tipo: texto
        obrigatorio: true
        buscavel: true

      - nome: cnpj_cpf
        label: "CNPJ ou CPF"
        tipo: texto
        obrigatorio: true
        buscavel: true

      - nome: endereco
        label: "Endereço"
        tipo: texto
        obrigatorio: false

      - nome: cidade
        label: "Cidade"
        tipo: texto
        obrigatorio: false

      - nome: uf
        label: "UF"
        tipo: texto
        obrigatorio: false

      - nome: telefone
        label: "Telefone"
        tipo: texto
        obrigatorio: false

      - nome: email
        label: "E-mail"
        tipo: texto
        obrigatorio: false

  - nome: vendas
    label: "Vendas"
    icone: "point_of_sale"
    campos:
      # Campo do tipo "referencia" vira um dropdown na tela, ligado à
      # tabela informada em tabela_ref. campo_exibicao é o campo dessa
      # tabela mostrado como rótulo (em vez do id puro).
      - nome: cliente_id
        label: "Cliente"
        tipo: referencia
        tabela_ref: clientes
        campo_exibicao: nome
        obrigatorio: true

      - nome: data_venda
        label: "Data da venda"
        tipo: data
        obrigatorio: false

      - nome: forma_pagamento
        label: "Forma de pagamento"
        tipo: texto
        obrigatorio: false

      - nome: valor_total
        label: "Valor total (R$)"
        tipo: decimal
        obrigatorio: false
        default: 0.0
        # Preenchimento manual/rápido pra exibir na lista e no cupom --
        # na hora de emitir a NF-e de verdade, o valor real é somado
        # automaticamente a partir dos itens em 'itens_venda'.

      - nome: observacoes
        label: "Observações"
        tipo: texto_longo
        obrigatorio: false

    abas:
      - nome: "Venda"
        campos: [cliente_id, data_venda, forma_pagamento, valor_total]
      - nome: "Outros"
        campos: [observacoes]

    # Cupom não fiscal impresso na impressora térmica (recibo simples,
    # não confundir com a NF-e/DANFE emitida pelo gateway fiscal abaixo)
    impressao:
      ativo: true
      titulo: "Recibo de Venda"
      campos: [cliente_id, data_venda, valor_total, forma_pagamento]
      rodape: "Obrigado pela preferência!"

    # Emissão de NF-e (nota que acompanha a mercadoria, gera o DANFE).
    # Precisa de um destinatário (campo_destinatario) e de uma tabela
    # de itens (tabela_itens) -- ambos configurados abaixo.
    fiscal:
      ativo: true
      tipo: nfe
      campo_destinatario: cliente_id
      tabela_itens: itens_venda

  - nome: itens_venda
    label: "Itens de Venda"
    icone: "list_alt"
    campos:
      # Este campo é o que liga cada item à sua venda -- o motor
      # descobre essa ligação sozinho ao montar a nota fiscal (não
      # precisa configurar isso de novo lá em cima).
      - nome: venda_id
        label: "Venda"
        tipo: referencia
        tabela_ref: vendas
        campo_exibicao: data_venda
        obrigatorio: true

      - nome: produto_id
        label: "Produto"
        tipo: referencia
        tabela_ref: produtos
        campo_exibicao: nome
        obrigatorio: true

      - nome: quantidade
        label: "Quantidade"
        tipo: inteiro
        obrigatorio: true
        default: 1
        minimo: 1     # não dá pra vender item com quantidade zero ou negativa

      - nome: valor_unitario
        label: "Valor unitário (R$)"
        tipo: decimal
        obrigatorio: true
        minimo: 0

      - nome: valor_total
        label: "Valor total do item (R$)"
        tipo: decimal
        obrigatorio: true
        minimo: 0

      # Campos fiscais do item -- em uma NF-e real, todo item precisa de
      # classificação fiscal (NCM) e natureza da operação (CFOP). Peça
      # esses códigos ao contador do cliente; cada ramo/produto tem os seus.
      - nome: ncm
        label: "NCM"
        tipo: texto
        obrigatorio: false

      - nome: cfop
        label: "CFOP"
        tipo: texto
        obrigatorio: false
