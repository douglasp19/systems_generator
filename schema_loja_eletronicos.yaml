sistema:
  nome: Loja de Eletrônicos - Exemplo
  banco: data/loja_eletronicos.db
  impressora:
    ativo: true
    conexao: arquivo
    colunas: 42
  fiscal:
    ativo: true
    provedor: focus_nfe
    ambiente: homologacao
    api_url: https://homologacao.focusnfe.com.br/v2
    api_token_env: FOCUS_NFE_TOKEN
    cnpj_emitente: 00.000.000/0001-00
tabelas:
- nome: produtos
  label: Produtos
  icone: inventory_2
  campos:
  - nome: nome
    label: Nome do produto
    tipo: texto
    obrigatorio: true
    buscavel: true
  - nome: categoria
    label: Categoria
    tipo: texto
    buscavel: true
  - nome: quantidade
    label: Quantidade em estoque
    tipo: inteiro
    obrigatorio: true
    default: 0
    minimo: 0
  - nome: estoque_minimo
    label: Estoque mínimo
    tipo: inteiro
    default: 5
    minimo: 0
  - nome: preco_venda
    label: Preço de venda (R$)
    tipo: decimal
    obrigatorio: true
    minimo: 0
  - nome: ncm
    label: NCM
    tipo: texto
  abas: []
  alerta_estoque:
    ativo: true
    campo_quantidade: quantidade
    campo_minimo: estoque_minimo
- nome: clientes
  label: Clientes (CPF na nota)
  icone: person
  campos:
  - nome: nome
    label: Nome
    tipo: texto
    obrigatorio: true
    buscavel: true
  - nome: cnpj_cpf
    label: CPF
    tipo: texto
    obrigatorio: true
    buscavel: true
  abas: []
- nome: vendas
  label: Vendas
  icone: point_of_sale
  campos:
  - nome: cliente_id
    label: Cliente (opcional -- CPF na nota)
    tipo: referencia
    tabela_ref: clientes
    campo_exibicao: nome
    obrigatorio: false
  - nome: forma_pagamento
    label: Forma de pagamento
    tipo: texto
  - nome: valor_total
    label: Valor total (R$)
    tipo: decimal
    default: 0.0
  impressao:
    ativo: true
    titulo: Cupom de Venda
    campos:
    - forma_pagamento
    - valor_total
    rodape: Volte sempre!
    auto_imprimir: true
  fiscal:
    ativo: true
    tipo: nfce
    campo_destinatario: cliente_id
    tabela_itens: itens_venda
  abas: []
- nome: itens_venda
  label: Itens de Venda
  icone: list_alt
  campos:
  - nome: venda_id
    label: Venda
    tipo: referencia
    tabela_ref: vendas
    campo_exibicao: forma_pagamento
    obrigatorio: true
  - nome: produto_id
    label: Produto
    tipo: referencia
    tabela_ref: produtos
    campo_exibicao: nome
    obrigatorio: true
  - nome: quantidade
    label: Quantidade
    tipo: inteiro
    obrigatorio: true
    default: 1
    minimo: 1
  - nome: valor_unitario
    label: Valor unitário (R$)
    tipo: decimal
    obrigatorio: true
    minimo: 0
  - nome: valor_total
    label: Valor total do item (R$)
    tipo: decimal
    obrigatorio: true
    minimo: 0
  abas: []
